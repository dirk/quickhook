name: release-build

on:
  workflow_call:
    inputs:
      version:
        description: "Version without the leading 'v'"
        type: string
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'
      - uses: ruby/setup-ruby@v1
        if: ${{ matrix.os == 'linux' }}
        with:
          ruby-version: '3.1'
      - run: gem install fpm
        if: ${{ matrix.os == 'linux' }}
      - name: Set version
        run: sed -i "s/VERSION = \"[^\"]*\"/VERSION = \"${{ inputs.version }}\"/" quickhook.go
      - name: Build
        run: |
          mkdir -p build/usr/bin
          GOARCH=${{ matrix.arch }} GOOS=${{ matrix.os }} CGO_ENABLED=0 go build -o build/usr/bin/quickhook
      - name: Package .debs
        if: ${{ matrix.os == 'linux' }}
        run: |
          fpm \
            --input-type dir \
            --output-type deb \
            --package quickhook-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.deb \
            --name quickhook \
            --license bsd-3-clause \
            --version ${{ inputs.version }} \
            --architecture ${{ matrix.arch }} \
            --chdir build .
      - name: Package .rpms
        if: ${{ matrix.os == 'linux' }}
        run: |
          fpm \
            --input-type dir \
            --output-type rpm \
            --package quickhook-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.rpm \
            --name quickhook \
            --license bsd-3-clause \
            --version ${{ inputs.version }} \
            --architecture ${{ matrix.arch }} \
            --chdir build .
      # Binary at the archive root so tool managers (e.g. mise's github
      # backend) find the executable without path overrides.
      - name: Package tarballs
        run: |
          tar -czf quickhook-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz -C build/usr/bin quickhook
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            *.deb
            *.rpm
            *.tar.gz
